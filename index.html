<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>長安書箱資源查詢系統</title>
    <!-- 使用 Tailwind CSS 進行樣式設計 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 使用 FontAwesome 載入圖示 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 引入圓潤的英文字體、中文無襯線體與新的傳統襯線體 -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Noto+Serif+TC:wght@600;900&family=Nunito:wght@400;700;900&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            /* 綜合英中字體，優先使用圓潤字體 */
            font-family: 'Nunito', 'Noto Sans TC', sans-serif;
            background-color: #BDE4B3; /* 對應圖片的淺綠色背景 */
            position: relative;
            overflow-x: hidden; /* 防止背景裝飾溢出 */
            color: #3B5A3E; /* 預設文字為深綠色 */
        }

        /* 模擬圖片中的背景裝飾元素 */
        body::before, body::after {
            content: '';
            position: fixed;
            z-index: -1;
        }
        
        body::before {
            /* 左上角的不規則形狀 */
            top: -50px;
            left: -50px;
            width: 300px;
            height: 300px;
            background-color: #A3D299;
            border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
            transform: rotate(-20deg);
        }

        body::after {
            /* 右下角的幾何形狀 */
            bottom: -100px;
            right: -50px;
            width: 400px;
            height: 350px;
            background-color: #A3D299;
            clip-path: polygon(0 40%, 100% 0, 100% 100%, 30% 100%);
            opacity: 0.7;
        }

        /* 標題字體，改為傳統襯線體 (Noto Serif TC) */
        .title-text {
            font-family: 'Noto Serif TC', serif;
            color: #1C2E4A; /* 搭配圖片的深藍/深灰色調 */
        }

        .subtitle-text {
            font-family: 'Noto Serif TC', serif;
            color: #5A7184; /* 沉穩的灰藍色 */
        }

        .bookshelf-container {
            background-color: #7B5F42; 
            border: 12px solid #5C452F;
            border-radius: 12px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.3), 0 15px 30px rgba(74, 122, 68, 0.4);
            position: relative;
            padding: 20px 10px;
        }

        .shelf {
            border-bottom: 25px solid #5C452F;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            position: relative;
            margin-bottom: 40px;
            box-shadow: 0 10px 10px -5px rgba(0,0,0,0.4);
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-start;
            align-items: flex-end;
            padding: 0 15px 5px 15px;
            min-height: 180px; 
        }
        
        .shelf::after {
            content: '';
            position: absolute;
            bottom: -25px;
            left: -15px;
            right: -15px;
            height: 5px;
            background: rgba(255,255,255,0.05);
        }

        .book-item {
            width: 100%;
            max-width: 320px;
            margin: 10px;
            background-color: #FFFAED; 
            border-radius: 6px;
            overflow: hidden;
            box-shadow: -4px 6px 12px rgba(0,0,0,0.25);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s ease;
            position: relative;
            border-left: 18px solid #F4C430; 
            z-index: 10;
        }

        .book-item:hover {
            transform: translateY(-15px) rotate(2deg);
            box-shadow: -8px 20px 25px rgba(0,0,0,0.3);
            z-index: 20;
        }

        /* 根據圖片色彩設定書籍書背顏色循環 (黃, 綠, 藍, 紅) */
        .book-item:nth-child(4n+1) { border-left-color: #F7B733; }
        .book-item:nth-child(4n+2) { border-left-color: #6C9A64; }
        .book-item:nth-child(4n+3) { border-left-color: #4B74B5; }
        .book-item:nth-child(4n+4) { border-left-color: #CC4B40; }

        .search-input:focus {
            outline: 3px solid #F7B733;
        }

        .primary-btn {
            background-color: #F7B733; 
            color: #4A7A44;
        }
        .primary-btn:hover {
            background-color: #FFC953;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(247, 183, 51, 0.4);
        }

        /* 讀取動畫 */
        .loader {
            border-top-color: #4A7A44;
            -webkit-animation: spinner 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;
            animation: spinner 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;
        }
        @keyframes spinner {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 塗鴉小裝飾 */
        .doodle {
            position: absolute;
            z-index: -1;
            opacity: 0.6;
        }
        .doodle-1 { top: 15%; left: 10%; width: 50px; height: 50px; border-bottom: 4px solid #7EAD73; border-right: 4px solid transparent; border-radius: 50%; transform: rotate(30deg); }
        .doodle-3 { top: 20%; right: 25%; width: 40px; height: 40px; border: 4px solid #7EAD73; border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%; }
        
        ::-webkit-scrollbar {
            width: 12px;
        }
        ::-webkit-scrollbar-track {
            background: #D5EFCE; 
        }
        ::-webkit-scrollbar-thumb {
            background: #8EBA84; 
            border-radius: 6px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #6C9A64; 
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex flex-col items-center relative">
    
    <!-- 裝飾用塗鴉 -->
    <div class="doodle doodle-1"></div>
    <div class="doodle doodle-3"></div>

    <header class="text-center mb-6 w-full max-w-5xl mt-2 md:mt-4 relative z-10 flex flex-col items-center">
        <div class="flex items-center justify-center gap-3 md:gap-4 mb-1">
            <!-- 可愛的微笑書本 SVG 圖示 -->
            <svg viewBox="0 0 100 100" class="w-14 h-14 md:w-20 md:h-20 drop-shadow-md transform transition duration-300 hover:scale-110 hover:-rotate-3" xmlns="http://www.w3.org/2000/svg">
                <!-- 紅色書籤 (從右頁上方伸出) -->
                <path d="M 64 6 L 76 6 L 76 24 L 70 20 L 64 24 Z" fill="#CC4B40" />
                
                <!-- 棕色書皮 -->
                <path d="M 5 20 Q 27.5 10 50 25 Q 72.5 10 95 20 L 95 85 Q 72.5 75 50 90 Q 27.5 75 5 85 Z" fill="#B06B1A" />
                
                <!-- 奶油色書頁 (左) -->
                <path d="M 12 26 Q 31 17 50 30 L 50 85 Q 31 72 12 80 Z" fill="#FFFAED" />
                
                <!-- 奶油色書頁 (右) -->
                <path d="M 88 26 Q 69 17 50 30 L 50 85 Q 69 72 88 80 Z" fill="#FFF4D4" />
                
                <!-- 中間書脊線 -->
                <line x1="50" y1="30" x2="50" y2="85" stroke="#E0CFA0" stroke-width="2" stroke-linecap="round" />
                
                <!-- 左頁裝飾線條 (模擬文字) -->
                <line x1="22" y1="42" x2="40" y2="46" stroke="#E0CFA0" stroke-width="2.5" stroke-linecap="round" />
                <line x1="22" y1="52" x2="36" y2="55" stroke="#E0CFA0" stroke-width="2.5" stroke-linecap="round" />
                <line x1="22" y1="62" x2="40" y2="66" stroke="#E0CFA0" stroke-width="2.5" stroke-linecap="round" />
                
                <!-- 右頁可愛表情 -->
                <!-- 粉嫩腮紅 -->
                <ellipse cx="61" cy="56" rx="4" ry="2.5" fill="#FFA5A5" opacity="0.9" />
                <ellipse cx="79" cy="56" rx="4" ry="2.5" fill="#FFA5A5" opacity="0.9" />
                
                <!-- 眼睛 -->
                <circle cx="65" cy="50" r="2.5" fill="#4A3B32" />
                <circle cx="75" cy="50" r="2.5" fill="#4A3B32" />
                
                <!-- 微笑 -->
                <path d="M 67 54 Q 70 59 73 54" stroke="#4A3B32" stroke-width="2.5" stroke-linecap="round" fill="none" />
            </svg>
            <h1 class="title-text text-4xl md:text-5xl font-black drop-shadow-sm tracking-widest">
                長安國小書箱資源庫
            </h1>
        </div>
        <p class="subtitle-text text-base md:text-xl mt-1 tracking-wider font-semibold">
            輸入書箱名稱或登錄號來尋找您需要的資源
        </p>
        <!-- 這是新增的圖書館連結 -->
        <a href="https://read.moe.edu.tw/193661/library" target="_blank" class="mt-4 text-[#B06B1A] hover:text-[#CC4B40] font-bold text-xl md:text-2xl border-b-[3px] border-[#B06B1A] hover:border-[#CC4B40] pb-1 transition-colors flex items-center gap-2">
            長安圖書系統 <i class="fa-solid fa-arrow-up-right-from-square text-lg md:text-xl"></i>
        </a>
    </header>

    <div class="w-full max-w-2xl mb-8 relative z-30">
        <form id="searchForm" class="relative flex items-center shadow-md rounded-full overflow-hidden bg-white border-[3px] border-white focus-within:border-[#F7B733] transition-colors duration-300">
            <div class="pl-5 text-[#8EBA84]">
                <i class="fa-solid fa-magnifying-glass text-base md:text-lg"></i>
            </div>
            <input 
                type="text" 
                id="searchInput" 
                placeholder="輸入書箱登錄號 或 關鍵字..." 
                class="w-full py-2.5 md:py-3 px-3 text-sm md:text-base text-[#3B5A3E] font-bold outline-none placeholder-[#A3D299] search-input bg-transparent"
            >
            <button 
                type="submit" 
                class="primary-btn font-black text-sm md:text-base py-2.5 md:py-3 px-6 md:px-8 transition duration-300 ease-in-out focus:outline-none uppercase tracking-wider"
            >
                Search
            </button>
        </form>
    </div>

    <!-- 載入中指示器 -->
    <div id="loadingIndicator" class="hidden flex-col items-center justify-center my-8">
        <div class="loader ease-linear rounded-full border-8 border-t-8 border-[#BDE4B3] h-20 w-20 mb-4 shadow-lg"></div>
        <h2 class="text-center text-2xl font-black text-[#4A7A44]">Searching...</h2>
    </div>

    <!-- 結果訊息提示 -->
    <div id="resultMessage" class="text-center text-xl md:text-2xl text-[#4A7A44] font-bold mb-6 hidden w-full px-4 drop-shadow-sm"></div>

    <!-- 書櫃展示區 -->
    <div id="bookshelfContainer" class="w-full max-w-6xl bookshelf-container hidden z-20">
        <!-- 層板將由 JavaScript 動態生成 -->
    </div>

    <!-- 分頁控制區 -->
    <div id="paginationContainer" class="w-full max-w-4xl flex justify-center items-center mt-12 mb-16 hidden space-x-6 z-20">
        <button id="prevBtn" class="bg-[#CC4B40] hover:bg-[#A83D33] text-white font-bold py-3 px-8 rounded-full shadow-lg disabled:opacity-50 disabled:cursor-not-allowed transition duration-300 transform hover:-translate-y-1">
            <i class="fa-solid fa-chevron-left mr-2"></i> 上一頁
        </button>
        <span id="pageIndicator" class="text-[#4A7A44] font-black text-xl bg-white/60 px-6 py-2 rounded-full shadow-sm">第 1 頁 / 共 1 頁</span>
        <button id="nextBtn" class="bg-[#4B74B5] hover:bg-[#3B5B8E] text-white font-bold py-3 px-8 rounded-full shadow-lg disabled:opacity-50 disabled:cursor-not-allowed transition duration-300 transform hover:-translate-y-1">
            下一頁 <i class="fa-solid fa-chevron-right ml-2"></i>
        </button>
    </div>

    <script>
        // ==========================================
        // ★★★ 請將下方的網址替換為您的 GAS 網頁應用程式網址 ★★★
        // ==========================================
        const GAS_URL = '請貼上您的_GAS_Web_App_URL'; 
        
        let allResults = [];
        let currentPage = 1;
        const itemsPerPage = 10;
        let currentQuery = '';

        // DOM 元素宣告
        const searchForm = document.getElementById('searchForm');
        const searchInput = document.getElementById('searchInput');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const resultMessage = document.getElementById('resultMessage');
        const bookshelfContainer = document.getElementById('bookshelfContainer');
        const paginationContainer = document.getElementById('paginationContainer');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const pageIndicator = document.getElementById('pageIndicator');

        // 監聽表單送出事件 (搜尋)
        searchForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const query = searchInput.value.trim();
            fetchData(query);
        });

        // 監聽分頁按鈕 - 上一頁
        prevBtn.addEventListener('click', () => {
            if (currentPage > 1) {
                currentPage--;
                renderPage();
            }
        });

        // 監聽分頁按鈕 - 下一頁
        nextBtn.addEventListener('click', () => {
            const totalPages = Math.ceil(allResults.length / itemsPerPage);
            if (currentPage < totalPages) {
                currentPage++;
                renderPage();
            }
        });

        /**
         * 隨機打亂陣列 (Fisher-Yates Shuffle 演算法)
         */
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        /**
         * 從 GAS API 取得資料 
         * (注意：這裡已經補上了 async 關鍵字來解決語法錯誤)
         */
        async function fetchData(query) {
            currentQuery = query;

            // 顯示載入中動畫，隱藏其他區塊
            loadingIndicator.classList.remove('hidden');
            resultMessage.classList.add('hidden');
            bookshelfContainer.classList.add('hidden');
            paginationContainer.classList.add('hidden');

            const url = `${GAS_URL}?action=search&query=${encodeURIComponent(query)}`;

            try {
                // 發送 GET 請求 (這裡使用 await 是安全的，因為外層有 async)
                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const result = await response.json();

                // 處理回應資料
                if (result.status === 'success') {
                    allResults = result.data;
                    
                    // 若是空查詢（代表預設載入全部），則自動隨機打亂所有資料
                    if (query === '') {
                        shuffleArray(allResults);
                    }

                    currentPage = 1; // 重置頁碼為第 1 頁
                    renderPage();
                } else {
                    throw new Error(result.message || 'API 發生錯誤');
                }
            } catch (error) {
                showError('發生錯誤：' + error.message);
            } finally {
                // 隱藏載入中動畫
                loadingIndicator.classList.add('hidden');
            }
        }

        /**
         * 渲染當前頁面的書櫃與資料
         */
        function renderPage() {
            bookshelfContainer.innerHTML = ''; // 清空書櫃
            
            if (allResults.length === 0) {
                resultMessage.textContent = currentQuery ? `找不到包含「${currentQuery}」的書箱。` : '目前沒有任何書箱資料。';
                resultMessage.classList.remove('hidden');
                resultMessage.classList.remove('text-red-600');
                bookshelfContainer.classList.add('hidden');
                paginationContainer.classList.add('hidden');
                return;
            }

            // 計算分頁的開始與結束索引
            const totalPages = Math.ceil(allResults.length / itemsPerPage);
            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const pageData = allResults.slice(startIndex, endIndex); // 擷取當前頁的 10 筆資料

            // 更新上方的訊息文字
            if (currentQuery) {
                resultMessage.textContent = `找到 ${allResults.length} 個符合「${currentQuery}」的書箱 (顯示第 ${startIndex + 1}-${Math.min(endIndex, allResults.length)} 筆)：`;
            } else {
                resultMessage.textContent = `為您隨機推薦書箱 (共 ${allResults.length} 箱，顯示第 ${startIndex + 1}-${Math.min(endIndex, allResults.length)} 筆)：`;
            }
            resultMessage.classList.remove('hidden');
            resultMessage.classList.remove('text-red-600');
            bookshelfContainer.classList.remove('hidden');

            // 顯示與更新分頁控制區的狀態
            if (totalPages > 1) {
                paginationContainer.classList.remove('hidden');
                pageIndicator.textContent = `第 ${currentPage} 頁 / 共 ${totalPages} 頁`;
                prevBtn.disabled = currentPage === 1;
                nextBtn.disabled = currentPage === totalPages;
            } else {
                paginationContainer.classList.add('hidden'); // 若只有一頁則隱藏分頁列
            }

            // 渲染書櫃 (每層 3 本書的版面設計不變)
            const itemsPerShelf = 3; 
            let currentShelf = null;

            pageData.forEach((item, index) => {
                // 每 3 本書建立一個新的層板
                if (index % itemsPerShelf === 0) {
                    currentShelf = document.createElement('div');
                    currentShelf.className = 'shelf';
                    bookshelfContainer.appendChild(currentShelf);
                }

                // 建立書本 DOM
                const bookCard = createBookCard(item);
                currentShelf.appendChild(bookCard);
            });
        }

        /**
         * 建立單個書箱的卡片 DOM
         */
        function createBookCard(item) {
            const card = document.createElement('div');
            card.className = 'book-item flex flex-col justify-between';

            // 處理說明文字
            const noteText = (item.note && item.note.trim() !== "") ? item.note : "無特別說明";
            
            // 處理描述連結按鈕，採用圓潤風格
            let linkHtml = '<span class="text-gray-400 font-bold text-sm bg-gray-100 px-3 py-1 rounded-full">無連結</span>';
            if (item.descriptionLink && item.descriptionLink.trim() !== "") {
                linkHtml = `<a href="${item.descriptionLink}" target="_blank" class="inline-flex items-center text-white bg-[#6C9A64] hover:bg-[#4A7A44] transition-colors font-bold text-sm px-4 py-2 rounded-full shadow-sm hover:shadow-md transform hover:scale-105">
                                <i class="fa-solid fa-book-open mr-2"></i> 詳細內容
                            </a>`;
            }

            // 內部 HTML 結構
            card.innerHTML = `
                <div class="p-5 flex-grow">
                    <div class="flex justify-between items-start mb-3">
                        <span class="bg-[#FFFAED] text-[#3B5A3E] text-xs font-black px-3 py-1 rounded-full border-2 border-[#D5EFCE] font-sans tracking-widest shadow-sm">
                            # ${item.id}
                        </span>
                    </div>
                    <h3 class="text-2xl font-black text-[#3B5A3E] mt-1 mb-3 leading-tight line-clamp-2 font-['Nunito']" title="${item.name}">${item.name}</h3>
                    
                    <div class="text-sm text-[#5C8C56] mb-4 bg-white/60 p-3 rounded-lg border border-[#D5EFCE] h-24 overflow-y-auto font-medium shadow-inner">
                        ${noteText}
                    </div>
                </div>
                
                <div class="bg-[#F2E8D5]/50 p-4 border-t border-black/5 flex justify-between items-center rounded-b-md">
                    ${linkHtml}
                    <button onclick="copyToClipboard('${item.id}')" class="text-[#CC4B40] hover:text-white hover:bg-[#CC4B40] w-10 h-10 flex items-center justify-center rounded-full transition-all shadow-sm hover:shadow-md" title="複製登錄號">
                        <i class="fa-regular fa-copy text-lg"></i>
                    </button>
                </div>
            `;
            return card;
        }

        /**
         * 顯示錯誤訊息
         */
        function showError(msg) {
            resultMessage.textContent = msg;
            resultMessage.classList.remove('hidden');
            resultMessage.classList.add('text-red-600'); 
            bookshelfContainer.classList.add('hidden');
            paginationContainer.classList.add('hidden'); 
        }

        /**
         * 複製文字到剪貼簿 (登錄號)
         */
        function copyToClipboard(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.top = "0";
            textArea.style.left = "0";
            textArea.style.position = "fixed";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();

            try {
                const successful = document.execCommand('copy');
                if(successful) {
                    const originalText = resultMessage.innerHTML;
                    resultMessage.innerHTML = `<span class="text-[#CC4B40] bg-white px-6 py-2 rounded-full shadow-md"><i class="fa-solid fa-check-circle mr-2"></i>已複製: ${text}</span>`;
                    resultMessage.classList.remove('hidden');
                    setTimeout(() => {
                         resultMessage.innerHTML = originalText;
                    }, 2000);
                }
            } catch (err) {
                console.error('無法複製', err);
            }
            document.body.removeChild(textArea);
        }

        // 頁面載入時自動執行一次空查詢，列出所有打亂後的書箱
        window.addEventListener('DOMContentLoaded', () => {
            if (GAS_URL !== '請貼上您的_GAS_Web_App_URL') {
                fetchData('');
            } else {
                 resultMessage.innerHTML = `<span class="text-red-500 bg-white p-2 rounded-md shadow"><i class="fa-solid fa-triangle-exclamation mr-2"></i>請先在程式碼中設定 GAS 網址 (GAS_URL)</span>`;
                 resultMessage.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
